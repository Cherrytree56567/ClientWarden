name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Conan
      uses: conan-io/setup-conan@v1
      with:
          cache_packages: true

    - name: Cache Cmake
      uses: actions/cache@v5
      with: 
        path: build
        key: cmake-tests-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: cmake-tests-${{ hashFiles('**/CMakeLists.txt') }}
      
    - name: Install Dependencies
      run: |
          cd tests
          mkdir -p build
          conan install . --output-folder=build --build=missing -s compiler.cppstd=20 -o "boost/*:without_cobalt=True" -s build_type=${{env.BUILD_TYPE}}
      
    - name: Configure CMake
      run: |
          cd tests
          cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=build/${{env.BUILD_TYPE}}/generators/conan_toolchain.cmake -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: |
          cd tests
          cmake --build build --config ${{env.BUILD_TYPE}}

    - name: Test Vault
      run: |
          cd tests/build
          ctest --output-on-failure

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ClientWarden-Release.zip
        path: build/Release
        archive: true
